spring.application.name=shop-validator
server.port=8081
spring.jpa.hibernate.ddl-auto=none

# Endereço do Kafka (use KAFKA_BOOTSTRAP_ADDRESS para sobrescrever via env)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_ADDRESS:localhost:9092}

# Configuração do consumidor
spring.kafka.consumer.group-id=group
spring.kafka.consumer.auto-offset-reset=earliest

# Use ErrorHandlingDeserializer para permitir tratamento adequado de SerializationException
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegates para os ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Força o uso do DTO local como tipo padrão e ignora headers de tipo do produtor
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.leandrosnazareth.shop_validator.dto.ShopDTO

# Pacotes confiáveis (inclui pacote do producer caso haja metadata apontando para ele)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.leandrosnazareth.shop_validator.dto,com.leandrosnazareth.shop_api.dto

# Producer: serializar valores como JSON (permite enviar ShopDTO diretamente)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Não enviar cabeçalhos de tipo do produtor (evita conflitos com consumer que força tipo local)
spring.kafka.producer.properties.spring.json.add.type.headers=false
